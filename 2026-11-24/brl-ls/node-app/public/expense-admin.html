<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BRL LS App – Expenses admin</title><link rel="stylesheet" href="/app.css">
<style>.fl{display:inline-block;font-size:10.5px;padding:1px 5px;margin:2px 3px 0 0;border-radius:2px}.fl.red{background:#fdecea;color:#b71c1c}.fl.amber{background:#fff4e0;color:#8a5300}.late{color:#b71c1c;font-weight:bold}.st{font-weight:bold;font-size:11px}</style></head>
<body>
<div class="top"><div><div class="k">Best Roadways · LS App · Expenses admin</div><div class="muted">Fooding, conveyance and other supervisor expenses — rules, approvers, register</div></div><div class="u"><a href="/admin" style="color:#c8102e">LS admin →</a></div></div>
<div class="wrap wide" id="app"></div>
<script>
const app = document.getElementById('app'), $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rs = n => 'Rs ' + (Math.round((+n || 0) * 100) / 100).toLocaleString('en-IN');
async function api(p, body) { const r = await fetch('/api' + p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); const j = await r.json().catch(() => ({ error: 'Server error' })); if (!r.ok) throw new Error(j.error || r.status); return j; }
let D = null, TAB = 'board';
function login(m) { app.innerHTML = '<div class="card" style="max-width:420px"><div class="h">Expenses admin<br><span class="r">Sign in</span></div>' + (m ? '<div class="msg err">' + esc(m) + '</div>' : '') + '<label>Admin PIN (same as LS admin)</label><input id="pin" type="password" inputmode="numeric" onkeydown="if(event.key===\'Enter\')doLogin()"><button class="btn" onclick="doLogin()">Open</button></div>'; }
async function doLogin() { try { await api('/admin/login', { pin: $('pin').value }); load(); } catch (e) { login(e.message); } }
async function load() { try { D = await api('/exp/admin/data'); render(); } catch (e) { login(); } }
const tabs = () => '<div class="tabbar">' + [['board', 'Board (late & red)'], ['claims', 'Claims'], ['appr', 'Approvers'], ['br', 'Branch rates & budget'], ['rules', 'Rules'], ['out', 'Export / feed']].map(([k, l]) => '<button class="' + (TAB === k ? 'on' : '') + '" onclick="TAB=\'' + k + '\';render()">' + l + '</button>').join('') + '</div>';
const m = (t, c) => '<div class="msg ' + (c || 'err') + '">' + esc(t) + '</div>';
function render() { let h = tabs(); const M = D.mis;
  if (TAB === 'board') {
    h += '<div class="card"><div class="h">Late at a step <span class="r">' + M.late.length + '</span></div><p class="muted">Negative MIS — only claims past their planned date. Verify ' + D.rules.verifyDays + ' day, approve ' + D.rules.approveDays + ' days, pay on ' + esc(M.payDay) + '.</p>' +
      (M.late.length ? '<table><tr><th>Claim</th><th>Supervisor</th><th>Branch</th><th>Waiting for</th><th>Planned</th><th>Days late</th><th>Rs</th></tr>' + M.late.map(x => '<tr><td><a href="#" onclick="openC(' + x.id + ');return false">' + esc(x.claim_no) + '</a></td><td>' + esc(x.name) + '</td><td>' + esc(x.branch) + '</td><td>' + x.waitingFor + '</td><td>' + esc(x.plan) + '</td><td class="late">' + x.daysLate + '</td><td>' + rs(x.amount) + '</td></tr>').join('') + '</table>' : m('Nothing late.', 'ok')) + '</div>' +
      '<div class="card"><div class="h">Branches · ' + esc(M.month) + '</div><table><tr><th>Branch</th><th>Claims</th><th>Claimed (net)</th><th>Paid</th><th>Budget</th><th></th></tr>' + M.branches.map(b => '<tr><td>' + esc(b.branch) + '</td><td>' + b.n + '</td><td>' + rs(b.amt) + '</td><td>' + rs(b.paid) + '</td><td>' + (b.budget ? rs(b.budget) : '<span class="muted">not set</span>') + '</td><td>' + (b.over ? '<span class="late">OVER BUDGET</span>' : '') + '</td></tr>').join('') + '</table></div>' +
      '<div class="card"><div class="h">Lines not claimed for 10+ days</div>' + (M.notClaimed.length ? '<table><tr><th>Supervisor</th><th>Branch</th><th>Lines</th><th>Rs</th><th>Oldest</th></tr>' + M.notClaimed.map(x => '<tr><td>' + esc(x.name) + '</td><td>' + esc(x.branch) + '</td><td>' + x.n + '</td><td>' + rs(x.amt) + '</td><td>' + esc(x.oldest) + '</td></tr>').join('') + '</table>' : m('None.', 'ok')) + '</div>' +
      '<div class="card"><div class="h">Flags this month</div>' + (Object.keys(M.flags).length ? Object.entries(M.flags).sort((a, b) => b[1] - a[1]).map(([k, n]) => '<span class="pill" style="margin:0 6px 6px 0">' + esc(k) + ' · ' + n + '</span>').join('') : m('No flags.', 'ok')) +
      '<p class="muted">NO_ATT no check-in that day · LR_MANUAL LR not made in app · DUP_SLIP same slip twice · NOT_LIVE trip typed · ABOVE_FAIR fare above GPS fair fare · DAY_CAP over daily conveyance cap · NO_TICKET / NO_BILL photo missing · LATE entered late · FAR photo away from branch · PHOTO_LATE slip photo long after LR · MORE_THAN_LR more fooding than LRs that day.</p></div>';
  }
  if (TAB === 'claims') h += '<div class="card"><div class="h">Claims <span class="r">' + D.claims.length + '</span></div><div style="overflow:auto"><table><tr><th>Claim</th><th>Supervisor</th><th>Branch</th><th>Period</th><th>Lines</th><th>Claimed</th><th>Payable</th><th>Red</th><th>Status</th><th>Verified</th><th>Approved</th><th>Paid</th><th>PDF</th></tr>' +
    D.claims.map(c => '<tr><td><a href="#" onclick="openC(' + c.id + ');return false"><b>' + esc(c.claim_no) + '</b></a></td><td>' + esc(c.name) + '</td><td>' + esc(c.branch) + '</td><td>' + esc(c.from_date) + ' → ' + esc(c.to_date) + '</td><td>' + c.line_count + '</td><td>' + rs(c.amount) + '</td><td><b>' + rs(c.approved_amount) + '</b></td><td>' + (c.red_flags || '') + '</td><td class="st">' + esc(c.status) + '</td><td>' + esc(c.verified_by || '') + '<br><span class="muted">' + esc(c.verified_ts || 'plan ' + (c.verify_plan || '')) + '</span></td><td>' + esc(c.approved_by || '') + '<br><span class="muted">' + esc(c.approved_ts || (c.approve_plan ? 'plan ' + c.approve_plan : '')) + '</span></td><td>' + esc(c.paid_by || '') + '<br><span class="muted">' + esc(c.paid_ts ? c.paid_ts + ' · ' + c.pay_mode + ' ' + c.pay_ref : (c.pay_plan ? 'plan ' + c.pay_plan : '')) + '</span></td><td>' + (c.pdf ? '<a href="' + c.pdf + '" target="_blank">PDF</a>' : '') + '</td></tr>').join('') + '</table></div></div><div id="cd"></div>';
  if (TAB === 'appr') h += '<div class="card"><div class="h">Approvers</div><p class="muted">Each approver signs in to the LS App with their own mobile + OTP (add them first in <a href="/admin">LS admin → Supervisors</a>, any division). Their approvals are stamped with their name and time on the voucher. The claimant, the verifier and the approver must be three different people.</p>' +
    '<table><tr><th>Person</th><th>Mobile</th><th>Role</th><th>Branches</th><th></th></tr>' + D.approvers.map(a => '<tr><td>' + esc(a.name || a.code) + ' <span class="muted">' + esc(a.code) + '</span></td><td>' + esc(a.mobile || '') + '</td><td><b>' + esc(a.role) + '</b></td><td>' + esc(a.branches) + '</td><td><button class="btn ghost sm" onclick="delAp(\'' + esc(a.code) + '\',\'' + a.role + '\')">Remove</button></td></tr>').join('') + '</table>' +
    '<h3>Add</h3><div class="row"><div><label>Person</label><select id="a_code">' + D.people.map(p => '<option value="' + esc(p.code) + '">' + esc(p.name + ' · ' + p.code + ' · ' + p.branch) + '</option>').join('') + '</select></div><div><label>Role</label><select id="a_role"><option value="VERIFY">VERIFY · branch head / P.C</option><option value="APPROVE">APPROVE · HR / accounts head</option><option value="PAY">PAY · cashier / accounts</option></select></div><div><label>Branches (* = all, or BHIWANDI,DRONAGIRI)</label><input id="a_br" value="*"></div></div><button class="btn sm" onclick="saveAp()">Save approver</button><div id="m"></div></div>';
  if (TAB === 'br') h += '<div class="card"><div class="h">Branch rates & budget</div><p class="muted">Blank fooding rate = default ' + rs(D.rules.fooding.rate) + '. Short code goes in the claim no. (EXP/BHW/2611/001). Monthly budget is for supervisor expenses of that branch (BMP: budget petty cash on the 1st).</p><table><tr><th>Branch</th><th>Short</th><th>Fooding Rs / vehicle</th><th>Monthly budget</th></tr>' + D.branchCfg.map(b => '<tr><td>' + esc(b.branch) + '</td><td>' + esc(b.short || '') + '</td><td>' + (b.fooding_rate != null ? rs(b.fooding_rate) : 'default') + '</td><td>' + (b.monthly_budget ? rs(b.monthly_budget) : '') + '</td></tr>').join('') + '</table>' +
    '<h3>Add / update</h3><div class="row"><div><label>Branch</label><select id="b_br">' + D.branches.map(b => '<option>' + esc(b) + '</option>').join('') + '</select></div><div><label>Short code</label><input id="b_short" placeholder="BHW"></div><div><label>Fooding Rs</label><input id="b_rate" inputmode="decimal" placeholder="100"></div><div><label>Monthly budget Rs</label><input id="b_bud" inputmode="decimal"></div></div><button class="btn sm" onclick="saveBr()">Save</button><div id="m"></div></div>';
  if (TAB === 'rules') { const R = D.rules, C = R.conveyance;
    h += '<div class="card"><div class="h">Rules</div><div class="row"><div><label>Default fooding Rs / vehicle</label><input id="r_food" value="' + R.fooding.rate + '"></div><div><label>Enter within (days)</label><input id="r_win" value="' + R.entryWindowDays + '"></div><div><label>Hard limit (days)</label><input id="r_hard" value="' + R.hardLimitDays + '"></div><div><label>LRs shown for fooding (days)</label><input id="r_lr" value="' + R.maxLrAgeDays + '"></div></div>' +
      '<h3>Conveyance</h3><div class="row"><div><label>Minimum fare</label><input id="r_min" value="' + C.minFare + '"></div><div><label>Fair Rs per km</label><input id="r_km" value="' + C.perKm + '"></div><div><label>Daily cap</label><input id="r_cap" value="' + C.dailyCap + '"></div><div><label>Ticket photo above</label><input id="r_tk" value="' + C.ticketAbove + '"></div></div><label>Modes (comma)</label><input id="r_modes" value="' + esc(C.modes.join(', ')) + '">' +
      '<h3>Other bills</h3><label>Categories (comma)</label><input id="r_cats" value="' + esc(R.other.categories.join(', ')) + '"><div class="row"><div><label>Reason needed above Rs</label><input id="r_note" value="' + R.other.needNoteAbove + '"></div><div><label>Photo must be within km of branch</label><input id="r_rad" value="' + R.branchRadiusKm + '"></div></div>' +
      '<h3>Timings (planned)</h3><div class="row"><div><label>Verify within days</label><input id="r_vd" value="' + R.verifyDays + '"></div><div><label>Approve within days</label><input id="r_ad" value="' + R.approveDays + '"></div><div><label>Pay day</label><select id="r_pay">' + ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'].map((d, i) => '<option value="' + i + '"' + (i === R.payWeekday ? ' selected' : '') + '>' + d + '</option>').join('') + '</select></div></div><button class="btn sm" onclick="saveRules()">Save rules</button><div id="m"></div></div>'; }
  if (TAB === 'out') h += '<div class="card"><div class="h">Export</div><a class="btn ghost sm" href="/api/exp/admin/export/claims.csv">Claims CSV</a> <a class="btn ghost sm" href="/api/exp/admin/export/lines.csv">All lines CSV</a><p class="muted">Add ?from=2026-11-01&to=2026-11-30 to the link for a period.</p>' +
    '<h3>Live feed for Google Sheets / F.M.S robots</h3><p>' + (D.feedKey ? 'Feed is ON: <code>' + esc(location.origin) + '/api/exp/feed?key=YOUR_KEY&from=2026-11-01&to=2026-11-30</code> returns claims + lines as JSON.' : 'Feed is OFF. Put <code>EXP_FEED_KEY=some-long-random-text</code> in the server .env and restart brl-ls to turn it on.') + '</p></div>';
  app.innerHTML = h; }
async function openC(id) { TAB = 'claims'; render(); const d = await api('/exp/claim/' + id); const c = d.claim;
  $('cd').innerHTML = '<div class="card"><div class="h">' + esc(c.claim_no) + ' <span class="r">' + esc(c.status) + '</span></div><button class="btn ghost sm" onclick="regen(' + c.id + ')">Rebuild PDF</button> ' + (c.pdf ? '<a class="btn ghost sm" href="' + c.pdf + '" target="_blank">Open PDF</a>' : '') +
    '<div style="overflow:auto"><table><tr><th>#</th><th>Date</th><th>Type</th><th>Details</th><th>Rs</th><th>Check</th><th>Flags</th><th>Proof</th></tr>' + d.lines.map(l => '<tr><td>' + l.id + '</td><td>' + esc(l.exp_date) + '</td><td>' + esc(l.type) + '</td><td>' + esc(l.type === 'FOODING' ? [l.vehicle_no, 'LR ' + l.lr_cn, l.party, l.to_place, l.slip_no].filter(Boolean).join(' · ') : l.type === 'CONVEYANCE' ? [l.from_place + ' → ' + l.to_place, l.mode, l.km ? l.km + ' km / fair ' + l.fair : '', l.live ? 'GPS' : 'typed'].filter(Boolean).join(' · ') : [l.category, l.party, l.note].filter(Boolean).join(' · ')) +
      (l.start_lat ? ' <a target="_blank" href="https://www.google.com/maps/dir/' + l.start_lat + ',' + l.start_lng + '/' + l.end_lat + ',' + l.end_lng + '">route</a>' : '') + '</td><td>' + rs(l.amount) + '</td><td>' + esc(l.check_status) + (l.check_reason ? '<br><span class="muted">' + esc(l.check_reason) + '</span>' : '') + '</td><td>' + l.flags.map(f => '<span class="fl ' + f.lvl + '">' + esc(f.t) + '</span>').join('') + '</td><td>' + (l.photo ? '<a href="' + l.photo + '" target="_blank"><img src="' + l.photo + '" style="height:56px"></a>' : '') + '</td></tr>').join('') + '</table></div>' +
    '<h3>History</h3>' + d.log.map(g => '<div class="muted">' + esc(g.ts) + ' · ' + esc(g.by_name) + ' · ' + esc(g.action) + ' ' + esc(g.note || '') + '</div>').join('') + '</div>'; $('cd').scrollIntoView(); }
async function regen(id) { try { await api('/exp/admin/pdf', { id }); D = await api('/exp/admin/data'); openC(id); } catch (e) { alert(e.message); } }
async function saveAp() { try { await api('/exp/admin/approver', { code: $('a_code').value, role: $('a_role').value, branches: $('a_br').value }); load(); } catch (e) { $('m').innerHTML = m(e.message); } }
async function delAp(code, role) { if (!confirm('Remove ' + role + ' for ' + code + '?')) return; await api('/exp/admin/approver/delete', { code, role }); load(); }
async function saveBr() { try { await api('/exp/admin/branch', { branch: $('b_br').value, short: $('b_short').value, fooding_rate: $('b_rate').value, monthly_budget: $('b_bud').value }); load(); } catch (e) { $('m').innerHTML = m(e.message); } }
async function saveRules() { const n = id => Number($(id).value); const list = id => $(id).value.split(',').map(s => s.trim()).filter(Boolean); const pd = +$('r_pay').value;
  try { await api('/exp/admin/rules', { fooding: { rate: n('r_food') }, entryWindowDays: n('r_win'), hardLimitDays: n('r_hard'), maxLrAgeDays: n('r_lr'), branchRadiusKm: n('r_rad'), verifyDays: n('r_vd'), approveDays: n('r_ad'), payWeekday: pd, payDayName: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][pd],
    conveyance: { minFare: n('r_min'), perKm: n('r_km'), dailyCap: n('r_cap'), ticketAbove: n('r_tk'), modes: list('r_modes') }, other: { categories: list('r_cats'), needNoteAbove: n('r_note') } }); D = await api('/exp/admin/data'); render(); $('m').innerHTML = m('Saved.', 'ok'); } catch (e) { $('m').innerHTML = m(e.message); } }
load();
</script></body></html>
