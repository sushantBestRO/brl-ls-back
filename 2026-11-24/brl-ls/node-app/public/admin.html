<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BRL LS App – Admin</title><link rel="stylesheet" href="/app.css"></head>
<body>
<div class="top"><div><div class="k">Best Roadways · LS App · Admin</div><div class="muted" id="sub">Supervisors, attendance, LR register</div></div><div class="u"><a href="/" style="color:#c8102e">Supervisor app →</a></div></div>
<div class="wrap wide" id="app"></div>
<script>
const app = document.getElementById('app'); const $ = id => document.getElementById(id); const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p, body) { const r = await fetch('/api/admin' + p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); const j = await r.json().catch(() => ({ error: 'Server error' })); if (!r.ok) throw new Error(j.error || r.status); return j; }
let D = null, TAB = 'lrs';
function login(msg) { app.innerHTML = '<div class="card" style="max-width:420px"><div class="h">Admin<br><span class="r">Sign in</span></div>' + (msg ? '<div class="msg err">' + esc(msg) + '</div>' : '') + '<label>Admin PIN</label><input id="pin" type="password" inputmode="numeric" onkeydown="if(event.key===\'Enter\')doLogin()"><button class="btn" onclick="doLogin()">Open</button></div>'; }
async function doLogin() { try { await api('/login', { pin: $('pin').value }); load(); } catch (e) { login(e.message); } }
async function load() { try { D = await api('/data'); render(); } catch (e) { login(); } }
function tabs() { return '<div class="tabbar">' + [['lrs', 'LR register'], ['att', 'Attendance'], ['sup', 'Supervisors'], ['br', 'Branches'], ['sys', 'System']].map(([k, l]) => '<button class="' + (TAB === k ? 'on' : '') + '" onclick="TAB=\'' + k + '\';render()">' + l + '</button>').join('') + '</div>'; }
function render() { let h = tabs();
  if (TAB === 'lrs') h += '<div class="card"><div class="h">LR register <span class="r">' + D.lrs.length + '</span></div><a class="btn ghost sm" href="/api/admin/export/lrs.csv">Download CSV</a><div style="overflow:auto"><table><tr><th>Time</th><th>CN</th><th>Division</th><th>Supervisor</th><th>Vehicle</th><th>From → To</th><th>Consignor</th><th>Consignee</th><th>EWB</th><th>Invoice</th><th>Pkgs</th><th>Wt</th><th>Driver</th><th>PDF</th><th></th></tr>' + D.lrs.map(r => '<tr><td>' + esc(r.ts) + '</td><td><b>' + esc(r.cn_no) + '</b></td><td>' + esc(r.supervisor) + '<br><span class="muted">' + esc(r.branch) + '</span></td><td>' + esc(r.vehicle_no) + '</td><td>' + esc(r.loading_station) + ' → ' + esc(r.delivery_station) + '</td><td>' + esc(r.consignor) + (r.consignor_contact || r.consignor_mobile ? '<br><span class="muted">' + esc(r.consignor_contact) + (r.consignor_mobile ? ' · ' + esc(r.consignor_mobile) : '') + '</span>' : '') + '</td><td>' + esc(r.consignee) + '</td><td>' + esc(r.ewb_no) + '</td><td>' + esc(r.invoice_no) + '</td><td>' + esc(r.packages) + '</td><td>' + esc(r.actual_wt) + '</td><td>' + esc(r.driver_phone) + '</td><td><a href="' + r.consignee_pdf + '" target="_blank">Consignee</a> · <a href="' + r.driver_pdf + '" target="_blank">Driver</a>' + (r.consignor_pdf ? ' · <a href="' + r.consignor_pdf + '" target="_blank">Consignor</a>' : '') + '</td><td><button class="btn ghost sm" data-id="' + r.id + '" data-cn="' + esc(r.cn_no) + '" onclick="delLr(this.dataset.id, this.dataset.cn)">Delete</button></td></tr>').join('') + '</table></div></div>';
  if (TAB === 'att') h += '<div class="card"><div class="h">Attendance <span class="r">last 500</span></div><a class="btn ghost sm" href="/api/admin/export/attendance.csv">Download CSV</a><div style="overflow:auto"><table><tr><th>Time</th><th>Supervisor</th><th>Division</th><th>Branch</th><th>Type</th><th>Location</th><th>Accuracy</th><th>Selfie</th><th>Note</th></tr>' + D.attendance.map(r => '<tr><td>' + esc(r.ts) + '</td><td>' + esc(r.name) + ' (' + esc(r.code) + ')</td><td>' + esc(r.branch) + '</td><td><span class="pill ' + (r.type === 'IN' ? 'g' : '') + '">' + r.type + '</span></td><td>' + (r.lat ? '<a target="_blank" href="https://maps.google.com/?q=' + r.lat + ',' + r.lng + '">' + esc(r.address || (r.lat.toFixed(5) + ', ' + r.lng.toFixed(5))) + '</a>' : '—') + '</td><td>' + (r.accuracy ? '±' + Math.round(r.accuracy) + ' m' : '') + '</td><td>' + (r.photo ? '<a href="' + r.photo + '" target="_blank"><img src="' + r.photo + '" style="height:60px;border-radius:2px"></a>' : '—') + '</td><td>' + esc(r.note) + '</td></tr>').join('') + '</table></div></div>';
  if (TAB === 'sup') h += '<div class="card"><div class="h">Supervisors <span class="r">' + D.supervisors.length + '</span></div><div style="overflow:auto"><table><tr><th>Code</th><th>Name</th><th>Mobile (login)</th><th>Division</th><th>Branch</th><th>Role</th><th>Active</th><th></th></tr>' + D.supervisors.map(s => '<tr><td>' + esc(s.code) + '</td><td>' + esc(s.name) + '</td><td>' + esc(s.mobile) + '</td><td>' + esc(s.division) + '</td><td>' + esc(s.branch) + '</td><td>' + esc(s.role) + '</td><td>' + (s.active ? 'Yes' : 'No') + '</td><td><button class="btn ghost sm" data-c="' + esc(s.code) + '" onclick="delSup(this.dataset.c)">Delete</button></td></tr>').join('') + '</table></div>' +
    '<h3>Add / update supervisor</h3><p class="muted">Supervisors sign in with mobile number + OTP. Mobile must be unique. PIN is only used if ALLOW_PIN_LOGIN=true.</p><div class="row"><div><label>Code</label><input id="s_code" placeholder="HR employee code"></div><div><label>Name</label><input id="s_name"></div><div><label>Mobile (10 digits)</label><input id="s_mobile" inputmode="numeric"></div></div><div class="row"><div><label>Division</label><select id="s_div">' + D.divisions.filter(d => d.active).map(d => '<option value="' + esc(d.code) + '">' + esc(d.code) + ' – ' + esc(d.name) + '</option>').join('') + '</select></div><div><label>PIN (optional)</label><input id="s_pin"></div><div><label>Branch</label><select id="s_branch">' + D.branches.map(b => '<option>' + esc(b.name) + '</option>').join('') + '</select></div><div><label>Role</label><select id="s_role"><option>Supervisor</option><option>Admin</option></select></div><div><label>Active</label><select id="s_active"><option value="1">Yes</option><option value="0">No</option></select></div></div><button class="btn sm" onclick="saveSup()">Save supervisor</button><div id="m"></div></div>';
  if (TAB === 'br') h += '<div class="card"><div class="h">Branches</div><table><tr><th>Branch</th><th>Address on LR</th><th>Phone</th><th>Email</th><th>Lat/Lng</th></tr>' + D.branches.map(b => '<tr><td>' + esc(b.name) + '</td><td>' + esc(b.address) + '</td><td>' + esc(b.phone) + '</td><td>' + esc(b.email) + '</td><td>' + (b.lat ? b.lat + ', ' + b.lng : '') + '</td></tr>').join('') + '</table>' +
    '<h3>Add / update branch</h3><div class="row"><div><label>Name</label><input id="b_name"></div><div><label>Phone</label><input id="b_phone"></div><div><label>Email</label><input id="b_email"></div></div><label>Address</label><input id="b_addr"><div class="row"><div><label>Latitude</label><input id="b_lat"></div><div><label>Longitude</label><input id="b_lng"></div></div><button class="btn sm" onclick="saveBr()">Save branch</button><div id="m"></div><p class="muted">Lat/Lng are used only when GEO_RADIUS_M &gt; 0 in .env (geo-fenced attendance).</p></div>';
  if (TAB === 'sys') h += '<div class="card"><div class="h">Divisions</div><table><tr><th>Code</th><th>Name</th><th>CN prefix</th><th>Next CN serial</th><th>Active</th></tr>' + D.divisions.map(d => '<tr><td><b>' + esc(d.code) + '</b></td><td>' + esc(d.name) + '</td><td>' + esc(d.cn_prefix) + '</td><td>' + d.cn_next + '</td><td>' + (d.active ? 'Yes' : 'No') + '</td></tr>').join('') + '</table>' +
    '<h3>Add / update division</h3><div class="row"><div><label>Code</label><input id="d_code" placeholder="e.g. JNPTC"></div><div><label>Name</label><input id="d_name" placeholder="Container Division"></div><div><label>CN prefix</label><input id="d_prefix" placeholder="JNPTC/"></div><div><label>Next CN serial</label><input id="d_next" inputmode="numeric" placeholder="1001"></div></div><button class="btn sm" onclick="saveDiv()">Save division</button><div id="md"></div><p class="muted">Each division has its own supervisors and its own LR number series.</p></div>' +
    '<div class="card"><div class="h">System</div><p>OTP delivery: <b>' + esc(D.smsMode) + '</b>' + (D.smsMode === 'console' ? ' — <span style="color:#b71c1c">test mode, no SMS is sent; OTPs appear below</span>' : '') + ' · Selfie: <b>' + (D.requireSelfie ? 'required' : 'optional') + '</b></p>' +
    (D.smsMode === 'console' && D.recentOtps.length ? '<table style="max-width:420px"><tr><th>Mobile</th><th>OTP</th><th>Status</th></tr>' + D.recentOtps.map(o => '<tr><td>' + esc(o.mobile) + '</td><td><b>' + esc(o.otp) + '</b></td><td>' + (o.expired ? 'expired' : 'valid') + '</td></tr>').join('') + '</table>' : '') +
    '<div class="row" style="max-width:520px;align-items:flex-end"><div><label>Test SMS to mobile</label><input id="sms_to" inputmode="numeric"></div><div><button class="btn sm dark" onclick="smsTest()">Send test OTP SMS</button></div></div>' +
    '<div class="row" style="max-width:520px;align-items:flex-end"><div><label>Enter OTP received</label><input id="sms_otp" inputmode="numeric" maxlength="8"></div><div><button class="btn sm dark" onclick="smsVerify()">Verify OTP</button></div></div>' +
    '<button class="btn sm dark" onclick="ewbTest()">Test e-way bill API connection</button><div id="m"></div><p class="muted" style="margin-top:14px">Settings (API credentials, SMS gateway, selfie, geo-fence) live in the server .env file. Restart the server after changing it. Database: data/app.db (SQLite) — back up by copying the file. PDFs: storage/lr, photos: storage/photos.</p></div>';
  app.innerHTML = h; }
async function saveSup() { try { await api('/supervisor', { code: $('s_code').value, name: $('s_name').value, mobile: $('s_mobile').value, pin: $('s_pin').value, branch: $('s_branch').value, division: $('s_div').value, role: $('s_role').value, active: $('s_active').value === '1' }); load(); } catch (e) { $('m').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; } }
async function saveBr() { try { await api('/branch', { name: $('b_name').value, phone: $('b_phone').value, email: $('b_email').value, address: $('b_addr').value, lat: $('b_lat').value || null, lng: $('b_lng').value || null }); load(); } catch (e) { $('m').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; } }
async function saveDiv() { try { await api('/division', { code: $('d_code').value, name: $('d_name').value, cn_prefix: $('d_prefix').value, cn_next: $('d_next').value || 1001 }); load(); } catch (e) { $('md').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; } }
async function smsTest() { $('m').innerHTML = '<div class="msg info">Sending…</div>'; try { const r = await api('/sms-test', { mobile: $('sms_to').value }); $('m').innerHTML = '<div class="msg ok">' + esc(r.msg) + '</div>'; } catch (e) { $('m').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; } }
async function delSup(code) { if (!confirm('Delete supervisor ' + code + '?\n\nTheir past attendance and LR records stay in the registers. They will be signed out immediately.')) return; try { await api('/supervisor/delete', { code }); load(); } catch (e) { alert(e.message); } }
async function smsVerify() { $('m').innerHTML = '<div class="msg info">Verifying…</div>'; try { const r = await api('/sms-test-verify', { mobile: $('sms_to').value, otp: $('sms_otp').value }); $('m').innerHTML = '<div class="msg ok">' + esc(r.msg) + '</div>'; } catch (e) { $('m').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; } }
async function delLr(id, cn) { if (!confirm('Delete LR ' + cn + '?\n\nThe LR is removed from the register and its PDFs stop opening. A backup copy is kept on the server. The CN number is NOT reused automatically.')) return; try { await api('/lr/delete', { id: Number(id) }); load(); } catch (e) { alert(e.message); } }
async function ewbTest() { $('m').innerHTML = '<div class="msg info">Testing…</div>'; try { const r = await api('/ewb-test', {}); $('m').innerHTML = '<div class="msg ok">' + esc(r.msg) + '</div>'; } catch (e) { $('m').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; } }
load();
</script></body></html>
